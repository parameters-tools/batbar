[package]
name = "batbar"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Parameters Tools <parameters.tools@gmail.com>"]
description = "A blazing-fast battery status visualizer reading Linux sysfs directly."
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/parameters-tools/batbar"
homepage = "https://github.com/parameters-tools/batbar"
keywords = ["cli", "battery", "power", "sysfs", "linux"]
categories = ["command-line-utilities", "system"]

[dependencies]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
